# A workflow that runs unit tests and sample app verification on every pull request
name: Tests

on:
  repository_dispatch:
    types: [test]
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Run plugin unit tests and checks
      run: |
        ./gradlew :secrets-gradle-plugin:build :secrets-gradle-plugin:check --stacktrace

    - name: Build sample app and verify test manifest placeholders
      run: |
        ./gradlew :sample-app:assembleDebug :sample-app:testDebugUnitTest --stacktrace
