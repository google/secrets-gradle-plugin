# A workflow that runs unit tests and sample app verification on every pull request
name: Tests

on:
  repository_dispatch:
    types: [test]
  pull_request:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Run plugin unit tests and checks
      run: |
        ./gradlew :secrets-gradle-plugin:build :secrets-gradle-plugin:check --stacktrace

    - name: Build sample app and verify test manifest placeholders
      run: |
        ./gradlew :sample-app:assembleDebug :sample-app:testDebugUnitTest --stacktrace
